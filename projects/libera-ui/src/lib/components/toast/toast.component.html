<section class="lib-toasts" [attr.aria-label]="label">
  <div aria-live="polite" aria-relevant="additions">
    <div
      *ngFor="let toast of service.toasts(); trackBy: trackById"
      class="lib-toast"
      [attr.data-tone]="toast.tone"
      [attr.role]="toast.tone === 'danger' ? 'alert' : null"
      (mouseenter)="service.pause(toast.id)"
      (mouseleave)="service.resume(toast.id)"
      (focusin)="service.pause(toast.id)"
      (focusout)="service.resume(toast.id)"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="9" />
        <path *ngIf="toast.tone === 'success'; else info" d="m8 12 3 3 5-6" />
        <ng-template #info><path d="M12 7v6m0 3v1" /></ng-template>
      </svg>
      <div class="lib-toast-text">
        <strong *ngIf="toast.title">{{ toast.title }}</strong>
        <span>{{ toast.message }}</span>
      </div>
      <button type="button" [attr.aria-label]="dismissLabel" (click)="service.dismiss(toast.id)">
        <lib-icon name="close" [size]="14" />
      </button>
    </div>
  </div>
</section>
