<nav class="sidenav" [id]="panelId" [hidden]="!isOpen" [attr.aria-label]="text.sideNavigation">
  <button #closeButton type="button" class="closebtn" (click)="closeNav()">{{ text.close }}</button
  ><ng-content></ng-content>
</nav>
<button
  #trigger
  type="button"
  class="nav-trigger"
  (click)="openNav()"
  [attr.aria-controls]="panelId"
  [attr.aria-expanded]="isOpen"
>
  {{ text.openNavigation }}
</button>
