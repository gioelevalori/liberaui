<nav class="sidenav" [id]="panelId" [hidden]="!isOpen" aria-label="Side navigation">
  <button #closeButton type="button" class="closebtn" (click)="closeNav()">Close</button
  ><ng-content></ng-content>
</nav>
<button
  #trigger
  type="button"
  class="nav-trigger"
  (click)="openNav()"
  [attr.aria-controls]="panelId"
  [attr.aria-expanded]="isOpen"
>
  Open navigation
</button>
