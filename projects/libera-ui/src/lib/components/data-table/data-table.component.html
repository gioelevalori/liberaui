<div class="lib-data-table-scroll" [class.loading]="loading">
  <table [attr.aria-busy]="loading || null">
    <caption *ngIf="caption">
      {{
        caption
      }}
    </caption>
    <thead>
      <tr>
        <th *ngIf="detail" scope="col" class="select-cell">
          <span class="lib-visually-hidden">{{ text.details }}</span>
        </th>
        <th *ngIf="selectable" scope="col" class="select-cell">
          <input
            type="checkbox"
            [attr.aria-label]="text.selectAllRows"
            [checked]="pageSelection.all"
            [indeterminate]="pageSelection.some && !pageSelection.all"
            [disabled]="!view.length"
            (change)="togglePage()"
          />
        </th>
        <th
          *ngFor="let column of columns"
          scope="col"
          [class.align-end]="column.align === 'end'"
          [attr.aria-sort]="ariaSort(column.key)"
        >
          <button
            *ngIf="column.sortable; else plainHeader"
            type="button"
            (click)="onSortClick($event, column.key)"
            (keydown)="onSortKeydown($event, column.key)"
          >
            {{ column.label }}
            <span
              class="sort-indicator"
              aria-hidden="true"
              [attr.data-direction]="sortDirection(column.key)"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="m8 10 4-4 4 4M8 14l4 4 4-4" />
              </svg>
              <small *ngIf="sort.length > 1 && sortIndex(column.key) >= 0">{{
                sortIndex(column.key) + 1
              }}</small>
            </span>
          </button>
          <ng-template #plainHeader>{{ column.label }}</ng-template>
        </th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let row of view">
        <tr [class.selected]="selection.includes(row[rowKey])">
          <td *ngIf="detail" class="select-cell">
            <button
              type="button"
              class="expand"
              [attr.aria-label]="text.rowDetails(rowLabel(row))"
              [attr.aria-expanded]="isExpanded(row)"
              [attr.aria-controls]="isExpanded(row) ? detailId(row) : null"
              (click)="toggleExpanded(row)"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="m9 6 6 6-6 6" />
              </svg>
            </button>
          </td>
          <td *ngIf="selectable" class="select-cell">
            <input
              type="checkbox"
              [attr.aria-label]="text.selectRow(rowLabel(row))"
              [checked]="selection.includes(row[rowKey])"
              (change)="toggleRow(row)"
            />
          </td>
          <ng-container *ngFor="let column of columns">
            <th
              *ngIf="column.key === rowHeader; else dataCell"
              scope="row"
              [class.align-end]="column.align === 'end'"
            >
              <ng-container *ngTemplateOutlet="cell; context: { column, row }" />
            </th>
            <ng-template #dataCell>
              <td [class.align-end]="column.align === 'end'">
                <ng-container *ngTemplateOutlet="cell; context: { column, row }" />
              </td>
            </ng-template>
          </ng-container>
        </tr>
        <tr *ngIf="detail && isExpanded(row)" class="detail-row">
          <td [id]="detailId(row)" [attr.colspan]="columnCount">
            <ng-container *ngTemplateOutlet="detail; context: { $implicit: row }" />
          </td>
        </tr>
      </ng-container>
      <tr *ngIf="!view.length">
        <td class="empty" [attr.colspan]="columnCount">
          {{ emptyText }}
        </td>
      </tr>
    </tbody>
  </table>
  <div *ngIf="loading" class="lib-data-table-loading" role="status">
    <span class="spinner" aria-hidden="true"></span>{{ text.loading }}
  </div>
</div>
<ng-template #cell let-column="column" let-row="row">
  <ng-container
    *ngIf="template(column.key) as custom; else plainCell"
    [ngTemplateOutlet]="custom"
    [ngTemplateOutletContext]="{ $implicit: row }"
  />
  <ng-template #plainCell>{{ cellText(column, row) }}</ng-template>
</ng-template>
<nav
  *ngIf="pageSize > 0 && pageCount > 1"
  class="lib-data-table-pager"
  [attr.aria-label]="text.pagination"
>
  <button type="button" [disabled]="page === 0" (click)="movePage(-1)">
    {{ text.previousPage }}
  </button>
  <span aria-live="polite">{{ text.pageStatus(page + 1, pageCount) }}</span>
  <button type="button" [disabled]="page >= pageCount - 1" (click)="movePage(1)">
    {{ text.nextPage }}
  </button>
</nav>
<span class="lib-visually-hidden" role="status">{{ sortMessage }}</span>
