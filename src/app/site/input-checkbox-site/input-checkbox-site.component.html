<app-components></app-components>

<div class="content-page">
  <h1>Checkbox</h1>
  <p>Checkbox is an extension to standard checkbox element with theming.</p>
  <app-code>{{codeImport}}</app-code>
  <app-input-checkbox></app-input-checkbox>
  <h2>Disabled</h2>
  <p>Checkbox is an extension to standard checkbox element with theming.</p>
  <app-code>{{codeDisabled}}</app-code>
  <app-input-checkbox [disabled]="true"></app-input-checkbox>
  <h2>Color</h2>
  <p>Checkbox is an extension to standard checkbox element with theming.</p>
  <app-code>{{codeColor}}</app-code>
  <app-input-checkbox color="yellow"></app-input-checkbox>
</div>
