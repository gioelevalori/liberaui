<lib-animations [animation]="'fadeInDown'">
  <div class="content-page">
    <h1>Checkbox</h1>
    <p>Checkbox is an extension to standard checkbox element with theming.</p>
    <lib-code>{{codeImport}}</lib-code>
    <lib-input-checkbox></lib-input-checkbox>
    <h2>Disabled</h2>
    <p>Checkbox is an extension to standard checkbox element with theming.</p>
    <lib-code>{{codeDisabled}}</lib-code>
    <lib-input-checkbox [disabled]="true"></lib-input-checkbox>
    <h2>Color</h2>
    <p>Checkbox is an extension to standard checkbox element with theming.</p>
    <lib-code>{{codeColor}}</lib-code>
    <lib-input-checkbox color="yellow"></lib-input-checkbox>
  </div>
</lib-animations>
