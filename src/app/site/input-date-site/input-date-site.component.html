<lib-animations [animation]="'fadeInDown'">
  <div class="content-page">
    <h1>Date</h1>
    <lib-code>{{ codeImport }}</lib-code>
    <p>
      Choose a date with a themed calendar or enter it directly. Supports Angular forms, optional
      minimum and maximum dates, and keyboard navigation.
    </p>
    <lib-input-date></lib-input-date>
    <lib-code>{{ codeDate }}</lib-code>
  </div>
</lib-animations>
