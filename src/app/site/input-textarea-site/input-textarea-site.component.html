<lib-animations [animation]="'fadeInDown'">
  <div class="content-page">
    <h1>Input Textarea</h1>
    <p>InputTextarea is an extension to standard input element with theming and keyfiltering.</p>
    <lib-code>{{codeImport}}</lib-code>

    <lib-input-textarea placeholder="Testo"></lib-input-textarea>
    <lib-code>{{codeTextarea}}</lib-code>

    <h2>Disabled</h2>
    <lib-input-textarea placeholder="Testo" [disabled]="true"></lib-input-textarea>
    <lib-code>{{codeDisabled}}</lib-code>
  </div>
</lib-animations>
