<div class="content-page">
  <app-animations [animation]="'fadeInDown'">
    <app-input-text placeholder="Nome"></app-input-text>
    <app-input-text [disabled]="true" placeholder="Cognome"></app-input-text>
  </app-animations>

  <app-animations [animation]="'fadeInOut'">
    <app-input-text placeholder="Nome"></app-input-text>
    <app-input-text [disabled]="true" placeholder="Cognome"></app-input-text>
  </app-animations>

  <app-animations [animation]="'slideInOut'">
    <app-input-text placeholder="Nome"></app-input-text>
    <app-input-text [disabled]="true" placeholder="Cognome"></app-input-text>
  </app-animations>

  <app-code>{{codeImport}}</app-code>
</div>
