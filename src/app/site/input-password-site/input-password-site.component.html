<lib-animations [animation]="'fadeInDown'">
  <div class="content-page">
    <h1>Input Password</h1>
    <p>A password input with a visibility toggle and Angular forms support.</p>
    <lib-code>{{codeImport}}</lib-code>

    <lib-input-password placeholder="Password"></lib-input-password>
    <lib-code>{{codeInputPassword}}</lib-code>

    <h2>Disabled</h2>
    <p>A password input with a visibility toggle and Angular forms support.</p>
    <lib-input-password [disabled]="true" placeholder="Password"></lib-input-password>
    <lib-code>{{codeDisabled}}</lib-code>
  </div>
</lib-animations>
