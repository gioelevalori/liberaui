  <p>InputPassword is an extension to standard input element with theming and keyfiltering.</p>
  <app-code>{{codeImport}}</app-code>

  <app-input-password placeholder="Password"></app-input-password>
  <app-code>{{codeInputPassword}}</app-code>

  <h2>Disabled</h2>
  <p>InputPassword is an extension to standard input element with theming and keyfiltering.</p>
  <app-input-password [disabled]="true" placeholder="Password"></app-input-password>
  <app-code>{{codeDisabled}}</app-code>
</div>
