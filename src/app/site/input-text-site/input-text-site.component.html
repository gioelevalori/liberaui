<lib-animations [animation]="'fadeInDown'">
  <div class="content-page">
    <h1>Input Text</h1>
    <p>InputText is an extension to standard input element with theming and keyfiltering.</p>
    <lib-code>{{ codeImport }}</lib-code>

    <lib-input-text placeholder="Nome"></lib-input-text>
    <lib-code>{{ codeInputText }}</lib-code>

    <h2>Disabled</h2>
    <lib-input-text [disabled]="true" placeholder="Cognome"></lib-input-text>
    <lib-code>{{ codeDisabled }}</lib-code>
  </div>
</lib-animations>
