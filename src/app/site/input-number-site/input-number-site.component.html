<lib-animations [animation]="'fadeInDown'">
  <div class="content-page">
    <h1>Input Number</h1>
    <p>InputNumber is an input component to provide numerical input.</p>
    <lib-code>{{ codeImport }}</lib-code>

    <lib-input-number placeholder="Numero" [min]="5" [max]="10"></lib-input-number>
    <lib-code>{{ codeInputNumber }}</lib-code>

    <h2>Disabled</h2>
    <lib-input-number
      placeholder="Numero"
      [min]="5"
      [max]="10"
      [disabled]="true"
    ></lib-input-number>
    <lib-code>{{ codeDisabled }}</lib-code>
  </div>
</lib-animations>
