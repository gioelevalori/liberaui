<app-components></app-components>

<app-animations [animation]="'fadeInDown'">
  <div class="content-page">
    <h1>Input Number</h1>
    <p>InputNumber is an input component to provide numerical input.</p>
    <app-code>{{codeImport}}</app-code>

    <app-input-number placeholder="Numero" [min]="5" [max]="10"></app-input-number>
    <app-code>{{codeInputNumber}}</app-code>

    <h2>Disabled</h2>
    <app-input-number placeholder="Numero" [min]="5" [max]="10" [disabled]="true"></app-input-number>
    <app-code>{{codeDisabled}}</app-code>
  </div>
</app-animations>
