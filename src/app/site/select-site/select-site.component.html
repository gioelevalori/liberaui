<lib-animations [animation]="'fadeInDown'">
  <div class="content-page">
    <h1>Select</h1>
    <p>Select is a form control for selecting a value from a set of options.</p>
    <lib-code>{{codeImport}}</lib-code>

    <lib-select [options]="cities"></lib-select>
    <lib-code>{{codeSelect}}</lib-code>

    <h2>Select</h2>
    <p>Select is a form control for selecting a value from a set of options.</p>
    <lib-select [options]="cities" [disabled]="true"></lib-select>
    <lib-code>{{codeDisabled}}</lib-code>
  </div>
</lib-animations>
