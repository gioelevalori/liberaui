<lib-animations [animation]="'fadeInDown'">
  <div class="content-page">
    <h1>Table</h1>
    <p>Table displays data in tabular format.</p>
    <lib-code>{{codeImport}}</lib-code>
    <lib-table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Surname</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Address</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Francesco</td>
          <td>Rossi</td>
          <td>francesco&#64;example.com</td>
          <td>3435675457</td>
          <td>Contrada Verdi</td>
        </tr>
        <tr>
          <td>Melissa</td>
          <td>Bianchi</td>
          <td>melissa&#64;example.com</td>
          <td>3546757545</td>
          <td>Contrada Rossi</td>
        </tr>
      </tbody>
    </lib-table>
    <lib-code>{{codeTable}}</lib-code>
  </div>
</lib-animations>
