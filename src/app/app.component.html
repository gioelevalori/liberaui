<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Skip to content</a>
<header class="site-header">
  <a class="brand" routerLink="/" (click)="menuOpen = false">Libera<span>UI</span></a>
  <div class="header-actions">
    <a class="repository-link" href="https://github.com/gioelevalori/ng-library">GitHub</a>
    <lib-switch-theme />
    <button class="menu-toggle" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="documentation-nav">{{ menuOpen ? 'Close menu' : 'Menu' }}</button>
  </div>
</header>
<div class="docs-layout">
  <nav id="documentation-nav" class="docs-nav" [class.is-open]="menuOpen" aria-label="Documentation">
    <h2>Getting started</h2>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page" (click)="menuOpen = false">Overview</a>
    <a routerLink="/installation" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="menuOpen = false">Installation</a>
    <a routerLink="/playground" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="menuOpen = false">Playground</a>
    <h2>Components</h2>
    <a *ngFor="let item of navigation" [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="menuOpen = false">{{ item.label }}</a>
  </nav>
  <main id="main-content" tabindex="-1">
    <router-outlet />
    <footer class="site-footer">Built by <a href="https://github.com/gioelevalori">gioelevalori</a>. LiberaUI is available under the MIT License.</footer>
  </main>
</div>
