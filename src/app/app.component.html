<app-animations [animation]="'fadeInDown'">
  <app-input-text placeholder="Nome"></app-input-text>
  <app-input-text [disabled]="true" placeholder="Cognome"></app-input-text><br>
  <app-input-number [min]="10" [max]="100" placeholder="Numero"></app-input-number>
  <app-input-password placeholder="Password"></app-input-password>
  <app-input-date></app-input-date><br>
  <app-input-textarea placeholder="Testo"></app-input-textarea><br>
  <app-button color="Black">Invia</app-button>
  <app-input-file></app-input-file>
  <app-input-checkbox></app-input-checkbox>
</app-animations>

<app-animations [animation]="'fadeInOut'">
  <app-table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Surname</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Adress</th>
      </tr>
    </thead>

      <tr>

        <td>Contrada Rossi</td>

    </tbody>
  </app-table>
</app-animations>

<app-animations [animation]="'slideInOut'">
  <app-select [options]="cities"></app-select>

  <app-switch-theme></app-switch-theme>

</app-animations>
